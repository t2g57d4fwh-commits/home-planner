
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Home Planner</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7f5;color:#253329;font:16px -apple-system,Arial,sans-serif}
header{background:#52745d;color:white;padding:24px 18px}
h1{margin:0;font-size:25px}
header p{margin:7px 0 0}
nav{display:flex;overflow:auto;gap:6px;background:white;padding:10px}
button{border:0;border-radius:9px;padding:11px;font:inherit;cursor:pointer}
nav button{background:#edf1ed;color:#34523b;white-space:nowrap}
nav .active,.primary{background:#52745d;color:white}
main{max-width:750px;margin:auto;padding:15px}
.card{background:white;padding:16px;border-radius:13px;margin-bottom:12px;box-shadow:0 1px 5px #0001}
h2{font-size:20px;margin:0 0 12px}
h3{font-size:16px}
.hidden{display:none}
label{display:block;margin:12px 0 5px;font-size:13px;font-weight:bold}
input:not([type=checkbox]),select{width:100%;padding:11px;border:1px solid #ccd5cc;border-radius:8px;font-size:16px;background:white}
input[type=checkbox]{width:21px;height:21px;accent-color:#52745d}
.primary{background:#52745d;color:white}
.light{background:#eaf0ea;color:#34523b}
.danger{background:#f9e7e7;color:#9a3434}
.task{display:flex;align-items:center;gap:9px;padding:12px 0;border-top:1px solid #eee}
.task span{flex:1}
.task small{display:block;color:#777;font-size:12px}
.task button{padding:7px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.actions button{flex:1}
.muted{color:#777}
.printOnly{display:none}
@media print{
header,nav,main{display:none!important}
.printOnly{display:block}
body{background:white}
.printTask{padding:9px 0}
.square{display:inline-block;width:16px;height:16px;border:1px solid #333;margin-right:12px}
}
</style>
</head>
<body>
<header>
<h1>🏡 My Home Planner</h1>
<p>Cleaning • Organising • Home Improvements</p>
</header>
<nav>
<button onclick="tab('today')">Today</button>
<button onclick="tab('cleaning')">Cleaning</button>
<button onclick="tab('organising')">Organising</button>
<button onclick="tab('projects')">Projects</button>
<button onclick="tab('rooms')">Rooms</button>
</nav>
<main>
<section id="today">
<div class="card">
<h2>Today's Checklist</h2>
<p id="date"></p>
<div id="due"></div>
<div class="actions">
<button class="primary" onclick="printList('today')">Print / Save PDF</button>
<button class="light" onclick="printList('sunday')">Sunday Checklist</button>
</div>
</div>
</section>
<section id="cleaning" class="hidden">
<div class="card">
<h2>Cleaning Tasks</h2>
<div id="cleaningForm"></div>
</div>
<div id="cleaningList"></div>
</section>
<section id="organising" class="hidden">
<div class="card">
<h2>Organising Tasks</h2>
<div id="organisingForm"></div>
</div>
<div id="organisingList"></div>
</section>
<section id="projects" class="hidden">
<div class="card">
<h2>Home Improvement Projects</h2>
<div id="projectsForm"></div>
</div>
<div id="projectsList"></div>
</section>
<section id="rooms" class="hidden">
<div class="card">
<h2>Manage Rooms</h2>
<form onsubmit="addRoom(event)">
<label>Room name</label>
<input name="room" required placeholder="Kitchen, Bathroom...">
<div class="actions"><button class="primary">Add Room</button></div>
</form>
</div>
<div id="roomList"></div>
</section>
</main>
<div id="printArea" class="printOnly"></div>
<script>
const KEY="my-home-planner-v1";
const ROOMKEY="my-home-planner-rooms-v2";
let tasks=[],rooms=[];
try{
tasks=JSON.parse(localStorage.getItem(KEY)||"[]");
if(!Array.isArray(tasks))tasks=[];
rooms=JSON.parse(localStorage.getItem(ROOMKEY)||"[]");
if(!Array.isArray(rooms))rooms=[];
}catch(e){tasks=[];rooms=[]}
function iso(d=new Date()){
return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function parse(s){return new Date(s+"T12:00:00")}
function plus(s,n){
let d=parse(s);d.setDate(d.getDate()+n);return iso(d);
}
function safe(s){
return String(s??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
})[c]);
}
function save(){
localStorage.setItem(KEY,JSON.stringify(tasks));
localStorage.setItem(ROOMKEY,JSON.stringify(rooms));
render();
}
function migrate(){
tasks.forEach(t=>{
if(!t.created)t.created=iso();
if(t.category==="cleaning"&&t.completed&&t.lastDone!==iso())t.completed=false;
if(t.room&&!rooms.includes(t.room))rooms.push(t.room);
});
save();
}
function tab(name){
document.querySelectorAll("main section").forEach(s=>s.classList.toggle("hidden",s.id!==name));
document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.textContent.toLowerCase()===name));
render();
}
function addRoom(e){
e.preventDefault();
let n=e.target.room.value.trim();
if(n&&!rooms.includes(n))rooms.push(n);
e.target.reset();save();
}
function options(current){
return [...new Set([...rooms,current].filter(Boolean))].map(r=>`<option value="${safe(r)}" ${r===current?"selected":""}>${safe(r)}</option>`).join("");
}
function form(cat,t={}){
let clean=cat==="cleaning";
let schedules=["daily","sunday","monday","tuesday","wednesday","thursday","friday","saturday","weekly","fortnightly","monthly","quarterly","custom"];
let labels={daily:"Every day",weekly:"Every 7 days",fortnightly:"Every 14 days",monthly:"Every 30 days",quarterly:"Every 90 days",custom:"Every X days"};
return `<form onsubmit="submitTask(event,'${cat}','${t.id||""}')">
<label>${cat==="projects"?"Project name":"Room"}</label>
${cat==="projects"?`<input name="room" required value="${safe(t.room||"")}">`:`<select name="room" required><option value="">Choose room</option>${options(t.room)}</select>`}
<label>${cat==="projects"?"Project step":"Task name"}</label>
<input name="name" required value="${safe(t.name||"")}">
${clean?`
<label>Cleaning type</label>
<select name="type">
${["Daily Maintenance","Deep Cleaning"].map(x=>`<option ${t.type===x?"selected":""}>${x}</option>`).join("")}
</select>
<label>Schedule</label>
<select name="schedule">
${schedules.map(x=>`<option value="${x}" ${t.schedule===x?"selected":""}>${labels[x]||"Every "+x}</option>`).join("")}
</select>
<label>Custom interval (days)</label>
<input name="interval" type="number" min="1" value="${t.interval||3}">
`:`<label>Priority</label><select name="priority">${["Low","Medium","High"].map(x=>`<option ${t.priority===x?"selected":""}>${x}</option>`).join("")}</select>`}
<div class="actions"><button class="primary">${t.id?"Save Changes":"Add Task"}</button></div>
</form>`;
}
function submitTask(e,cat,id){
e.preventDefault();
let f=new FormData(e.target);
let t=tasks.find(x=>String(x.id)===id);
if(!t){
t={id:String(Date.now())+Math.random(),created:iso(),lastDone:null,completed:false};
tasks.push(t);
}
Object.assign(t,{
category:cat,
room:f.get("room"),
name:f.get("name"),
type:f.get("type")||"",
schedule:f.get("schedule")||"once",
priority:f.get("priority")||"Medium",
interval:Number(f.get("interval"))||3
});
document.getElementById(cat+"Form").innerHTML=form(cat);
save();
}
function editTask(id){
let t=tasks.find(x=>String(x.id)===String(id));
if(!t)return;
tab(t.category);
document.getElementById(t.category+"Form").innerHTML=form(t.category,t);
window.scrollTo(0,0);
}
function removeTask(id){
if(confirm("Delete this task?")){
tasks=tasks.filter(x=>String(x.id)!==String(id));save();
}
}
const weekdays=["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
function nextDue(t){
let created=t.created||iso(),last=t.lastDone;
if(t.schedule==="daily")return last?plus(last,1):created;
let weekday=weekdays.indexOf(t.schedule);
if(weekday>=0){
let start=last?plus(last,1):created;
let d=parse(start);
d.setDate(d.getDate()+(weekday-d.getDay()+7)%7);
return iso(d);
}
let interval={weekly:7,fortnightly:14,monthly:30,quarterly:90,custom:Number(t.interval)||3}[t.schedule]||7;
return last?plus(last,interval):created;
}
function due(t){
if(t.category!=="cleaning")return !t.completed;
return nextDue(t)<=iso();
}
function complete(id,checked){
let t=tasks.find(x=>String(x.id)===String(id));
if(!t)return;
if(t.category==="cleaning"){
t.lastDone=checked?iso():null;
t.completed=checked;
}else t.completed=checked;
save();
}
function taskHTML(t){
let done=t.category==="cleaning"?t.lastDone===iso():t.completed;
return `<div class="task">
<input type="checkbox" ${done?"checked":""} onchange="complete('${t.id}',this.checked)">
<span><b>${safe(t.name)}</b><small>${safe(t.room)} · ${safe(t.type||t.priority||"")}</small></span>
<button class="light" onclick="editTask('${t.id}')">Edit</button>
<button class="danger" onclick="removeTask('${t.id}')">×</button>
</div>`;
}
function grouped(items){
if(!items.length)return "<p class='muted'>No tasks to show.</p>";
return [...new Set(items.map(t=>t.room))].sort().map(r=>`<h3>${safe(r)}</h3>${items.filter(t=>t.room===r).map(taskHTML).join("")}`).join("");
}
function render(){
document.getElementById("date").textContent=new Date().toLocaleDateString("en-AU",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
document.getElementById("due").innerHTML=grouped(tasks.filter(due));
["cleaning","organising","projects"].forEach(cat=>{
document.getElementById(cat+"List").innerHTML=`<div class="card">${grouped(tasks.filter(t=>t.category===cat))}</div>`;
});
document.getElementById("roomList").innerHTML=rooms.map(r=>`<div class="card"><b>${safe(r)}</b></div>`).join("");
}
function printList(mode){
let items=mode==="today"?tasks.filter(due):tasks.filter(t=>t.category==="cleaning"&&(t.schedule==="sunday"||(due(t)&&t.schedule!=="daily")));
let names=[...new Set(items.map(t=>t.room))].sort();
document.getElementById("printArea").innerHTML=`<h1>${mode==="today"?"Today's Checklist":"Sunday Cleaning Checklist"}</h1><p>${new Date().toLocaleDateString("en-AU")}</p>`+names.map(r=>`<h2>${safe(r)}</h2>`+items.filter(t=>t.room===r).map(t=>`<div class="printTask"><span class="square"></span>${safe(t.name)}</div>`).join("")).join("");
window.print();
}
["cleaning","organising","projects"].forEach(cat=>{
document.getElementById(cat+"Form").innerHTML=form(cat);
});
migrate();tab("today");
  
// VERSION 3 - PDF PREVIEW AND EXPORT
function printList(mode) {
  const today = iso();
  const items = mode === "today"
    ? tasks.filter(due)
    : tasks.filter(t =>
        t.category === "cleaning" &&
        (t.schedule === "sunday" ||
         (due(t) && t.schedule !== "daily"))
      );

  const title = mode === "today"
    ? "Today's Checklist"
    : "Sunday Cleaning Checklist";

  const old = document.getElementById("pdfPreview");
  if (old) old.remove();

  const panel = document.createElement("div");
  panel.id = "pdfPreview";
  panel.style.cssText =
    "position:fixed;inset:0;background:#f5f7f5;" +
    "z-index:9999;overflow:auto;padding:18px";

  const groupedRooms = [...new Set(
    items.map(t => t.room || "Other")
  )].sort();

  const content = groupedRooms.map(room => {
    const lines = items.filter(t =>
      (t.room || "Other") === room
    ).map(t =>
      '<div style="padding:9px 0">' +
      '<span style="display:inline-block;width:17px;' +
      'height:17px;border:1px solid #555;' +
      'margin-right:10px"></span>' +
      safe(t.name) + '</div>'
    ).join("");

    return "<h3>" + safe(room) + "</h3>" + lines;
  }).join("");

  panel.innerHTML =
    '<div style="max-width:650px;margin:auto">' +
    '<button id="closePDF" class="light">Close Preview</button>' +
    '<div style="background:white;padding:20px;' +
    'margin:15px 0;border-radius:10px">' +
    '<h2>' + title + '</h2>' +
    '<p>' + new Date().toLocaleDateString("en-AU") + '</p>' +
    (content || "<p>No tasks due.</p>") +
    '</div>' +
    '<button id="savePDF" class="primary" ' +
    'style="width:100%">Save / Share PDF</button>' +
    '</div>';

  document.body.appendChild(panel);

  document.getElementById("closePDF").onclick =
    () => panel.remove();

  document.getElementById("savePDF").onclick =
    () => makeChecklistPDF(title, items);
}

async function makeChecklistPDF(title, items) {
  const clean = value => String(value || "")
    .normalize("NFKD")
    .replace(/[^\x20-\x7E]/g, "?");

  const esc = value => clean(value)
    .replace(/\\/g, "\\\\")
    .replace(/\(/g, "\\(")
    .replace(/\)/g, "\\)");

  const rows = [
    {text:title, heading:true},
    {text:new Date().toLocaleDateString("en-AU")},
    {text:""}
  ];

  const rooms = [...new Set(
    items.map(t => t.room || "Other")
  )].sort();

  rooms.forEach(room => {
    rows.push({text:room, heading:true});
    items.filter(t =>
      (t.room || "Other") === room
    ).forEach(t => {
      const words = clean(t.name).split(" ");
      let line = "";
      let first = true;

      words.forEach(word => {
        if ((line + " " + word).length > 65 && line) {
          rows.push({text:line, checkbox:first});
          first = false;
          line = word;
        } else {
          line += (line ? " " : "") + word;
        }
      });

      rows.push({text:line, checkbox:first});
    });
    rows.push({text:""});
  });

  if (!items.length) rows.push({text:"No tasks due."});

  const objects = [];
  const add = s => {
    objects.push(s);
    return objects.length;
  };

  const catalog = add("");
  const pagesRoot = add("");
  const font = add(
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>"
  );

  const pageIds = [];

  for (let start = 0; start < rows.length; start += 43) {
    const pageRows = rows.slice(start, start + 43);
    let stream = "";

    pageRows.forEach((r, i) => {
      const y = 790 - i * 17;
      const x = r.checkbox ? 65 : 45;

      if (r.checkbox) {
        stream += "45 " + (y - 2) +
          " 11 11 re S\n";
      }

      stream += "BT /F1 " +
        (r.heading ? "15" : "11") +
        " Tf " + x + " " + y +
        " Td (" + esc(r.text) + ") Tj ET\n";
    });

    const contentId = add(
      "<< /Length " + stream.length +
      " >>\nstream\n" + stream + "endstream"
    );

    const pageId = add(
      "<< /Type /Page /Parent " + pagesRoot +
      " 0 R /MediaBox [0 0 595 842] " +
      "/Resources << /Font << /F1 " + font +
      " 0 R >> >> /Contents " + contentId +
      " 0 R >>"
    );

    pageIds.push(pageId);
  }

  objects[catalog - 1] =
    "<< /Type /Catalog /Pages " + pagesRoot + " 0 R >>";

  objects[pagesRoot - 1] =
    "<< /Type /Pages /Kids [" +
    pageIds.map(id => id + " 0 R").join(" ") +
    "] /Count " + pageIds.length + " >>";

  let pdf = "%PDF-1.4\n";
  const offsets = [0];

  objects.forEach((obj, i) => {
    offsets.push(pdf.length);
    pdf += (i + 1) + " 0 obj\n" +
      obj + "\nendobj\n";
  });

  const xref = pdf.length;
  pdf += "xref\n0 " + (objects.length + 1) +
    "\n0000000000 65535 f \n";

  offsets.slice(1).forEach(offset => {
    pdf += String(offset).padStart(10, "0") +
      " 00000 n \n";
  });

  pdf += "trailer\n<< /Size " +
    (objects.length + 1) +
    " /Root " + catalog +
    " 0 R >>\nstartxref\n" +
    xref + "\n%%EOF";

  const file = new File(
    [pdf],
    "home-planner-checklist.pdf",
    {type:"application/pdf"}
  );

  try {
    if (navigator.canShare &&
        navigator.canShare({files:[file]})) {
      await navigator.share({files:[file]});
      return;
    }
  } catch(e) {
    if (e.name === "AbortError") return;
  }

  const url = URL.createObjectURL(file);
  const a = document.createElement("a");
  a.href = url;
  a.download = file.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

</script>
</body>
</html>
