
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Home Planner</title>
<meta name="theme-color" content="#f5f7f5">
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#f5f7f5;color:#253329;margin:0}
header{background:#52745d;color:white;padding:24px 18px}
h1{font-size:25px;margin:0 0 5px}
header p{margin:0;font-size:14px}
nav{display:flex;gap:5px;overflow-x:auto;background:white;padding:10px}
nav button{flex:1;min-width:90px;background:#edf1ed;color:#34523b}
nav button.active{background:#52745d;color:white}
button{border:0;border-radius:9px;padding:11px;font-size:14px;font-weight:600;cursor:pointer}
main{padding:15px;max-width:750px;margin:auto}
.card{background:white;padding:16px;border-radius:13px;margin-bottom:12px;box-shadow:0 1px 5px #0001}
h2{font-size:20px;margin:0 0 12px}
h3{font-size:16px}
input,select{width:100%;padding:11px;border:1px solid #ccd5cc;border-radius:8px;margin:5px 0 12px;font-size:16px}
label{display:block;font-size:13px;font-weight:bold}
.primary{background:#52745d;color:white}
.light{background:#eaf0ea;color:#34523b}
.danger{background:#f9e7e7;color:#9a3434}
.task{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid #eee}
.task input{width:21px;height:21px;margin:0;accent-color:#52745d}
.task span{flex:1}
small{color:#777}
.overdue{color:#b14d3d}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1}
.hidden{display:none}
@media print{
header,nav,.no-print,form{display:none!important}
body{background:white}
.card{box-shadow:none;border:0;padding:5px}
.task input{appearance:none;border:1px solid black;border-radius:0;width:17px;height:17px}
}
</style>
</head>
<body>
<header>
<h1>🏡 My Home Planner</h1>
<p>Cleaning • Organising • Home Improvements</p>
</header>
<nav class="no-print">
<button onclick="tab('today')" id="b-today">Today</button>
<button onclick="tab('cleaning')" id="b-cleaning">Cleaning</button>
<button onclick="tab('organising')" id="b-organising">Organising</button>
<button onclick="tab('projects')" id="b-projects">Projects</button>
</nav>
<main>
<section id="today">
<div class="card">
<h2>Today's Checklist</h2>
<p id="date"></p>
<div id="due"></div>
<div class="actions no-print">
<button class="primary" onclick="window.print()">Print / Save PDF</button>
</div>
</div>
</section>

<section id="cleaning" class="hidden">
<div class="card">
<h2>Cleaning Tasks</h2>
<form onsubmit="addTask(event,'cleaning')">
<label>Room</label><input name="room" placeholder="Kitchen, Bathroom..." required>
<label>Cleaning task</label><input name="name" placeholder="Clean shower" required>
<label>Type</label>
<select name="type"><option>Daily Maintenance</option><option>Deep Cleaning</option></select>
<label>Schedule</label>
<select name="schedule">
<option value="daily">Every day</option>
<option value="sunday">Every Sunday</option>
<option value="monday">Every Monday</option>
<option value="weekly">Every 7 days</option>
<option value="fortnightly">Every 14 days</option>
<option value="monthly">Every 30 days</option>
<option value="quarterly">Every 90 days</option>
</select>
<button class="primary">Add cleaning task</button>
</form>
</div>
<div id="cleaningList"></div>
</section>

<section id="organising" class="hidden">
<div class="card">
<h2>Organising Tasks</h2>
<form onsubmit="addTask(event,'organising')">
<label>Room</label><input name="room" placeholder="Bedroom, Pantry..." required>
<label>Task</label><input name="name" placeholder="Organise wardrobe" required>
<label>Priority</label>
<select name="priority"><option>Low</option><option>Medium</option><option>High</option></select>
<button class="primary">Add organising task</button>
</form>
</div>
<div id="organisingList"></div>
</section>

<section id="projects" class="hidden">
<div class="card">
<h2>Home Improvement Projects</h2>
<form onsubmit="addTask(event,'projects')">
<label>Project name</label><input name="room" placeholder="TV unit renovation" required>
<label>Next step</label><input name="name" placeholder="Measure wall" required>
<label>Priority</label>
<select name="priority"><option>Low</option><option>Medium</option><option>High</option></select>
<button class="primary">Add project step</button>
</form>
</div>
<div id="projectsList"></div>
</section>
</main>
<script>
const KEY="my-home-planner-v1";
let tasks=JSON.parse(localStorage.getItem(KEY)||"[]");
const today=()=>new Date().toLocaleDateString("en-CA");
const days={sunday:0,monday:1};
function save(){localStorage.setItem(KEY,JSON.stringify(tasks));render()}
function tab(id){
document.querySelectorAll("main section").forEach(s=>s.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
document.getElementById("b-"+id).classList.add("active");
}
function addTask(e,category){
e.preventDefault();
let f=new FormData(e.target);
tasks.push({
id:Date.now()+Math.random(),
category,room:f.get("room"),name:f.get("name"),
type:f.get("type")||"",
schedule:f.get("schedule")||"once",
priority:f.get("priority")||"Medium",
created:today(),lastDone:null,completed:false
});
e.target.reset();save();
}
function dateFrom(s){return new Date(s+"T12:00:00")}
function isDue(t){
if(t.category!=="cleaning")return !t.completed;
let now=new Date(),d=now.getDay(),last=t.lastDone;
if(t.schedule==="daily")return last!==today();
if(days[t.schedule]!==undefined){
return d===days[t.schedule]&&last!==today()||
(!last&&dateFrom(t.created)<dateFrom(today()));
}
let interval={weekly:7,fortnightly:14,monthly:30,quarterly:90}[t.schedule]||7;
let start=dateFrom(last||t.created);
start.setDate(start.getDate()+interval);
return start<=dateFrom(today());
}
function toggle(id,checked){
let t=tasks.find(x=>x.id===id);
if(!t)return;
t.completed=checked;
t.lastDone=checked?today():null;
save();
}
function remove(id){
if(confirm("Delete this task?")){
tasks=tasks.filter(x=>x.id!==id);save();
}}
function taskHTML(t){
return '<div class="task">'+
'<input type="checkbox" '+(t.completed?'checked':'')+
' onchange="toggle('+t.id+',this.checked)">'+
'<span><b>'+escapeHTML(t.name)+'</b><br><small>'+
escapeHTML(t.room)+' · '+escapeHTML(t.priority)+
(t.type?' · '+escapeHTML(t.type):'')+
'</small></span>'+
'<button class="danger no-print" onclick="remove('+t.id+')">×</button></div>';
}
function escapeHTML(s){
return String(s||"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#39;"
})[c]);
}
function render(){
document.getElementById("date").textContent=
new Date().toLocaleDateString("en-AU",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
let due=tasks.filter(isDue);
document.getElementById("due").innerHTML=due.length?
due.map(taskHTML).join(""):"<p>Nothing due today. Great work!</p>";
for(let cat of ["cleaning","organising","projects"]){
let items=tasks.filter(t=>t.category===cat);
document.getElementById(cat+"List").innerHTML=
'<div class="card">'+(items.length?items.map(taskHTML).join(""):"<p>No tasks added yet.</p>")+'</div>';
}
}
tab("today");render();
</script>
</body>
</html>
